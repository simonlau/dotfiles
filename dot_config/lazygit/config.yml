git:
  diffRenderers:
    - name: delta
      command: delta --{{colorScheme}} --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - name: difft
      type: extDiff
      command: difft --color=always --background={{colorScheme}} --display=inline --syntax-highlight=on --context={{diffContext}}
    - name: raw git
      type: rawGit
      colorArg: always
